# Reference Nginx server block for labbstudio.pl.
# Install on the VPS at /etc/nginx/sites-available/labb-studio, then:
#   ln -s /etc/nginx/sites-available/labb-studio /etc/nginx/sites-enabled/labb-studio
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d labbstudio.pl -d www.labbstudio.pl
# certbot will rewrite this file to add the HTTPS (443) server block + redirect.

server {
    listen 80;
    server_name labbstudio.pl www.labbstudio.pl;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
